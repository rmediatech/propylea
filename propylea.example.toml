# 🦀 Propylea Configuration File
# Sovereign ultra-low-memory L7 reverse proxy & perimeter defense gateway.
# For full documentation: https://github.com/xuoxod/propylea/blob/main/docs/CONFIGURATION.md

[server]
# Port 80 HTTP-to-HTTPS instant 301 redirector
http_bind = "0.0.0.0:80"

# Port 443 HTTPS reverse proxy listener
https_bind = "0.0.0.0:443"

# ACME challenge directory for Let's Encrypt automated zero-downtime HTTP-01 renewal
# Defaults to /var/www/letsencrypt (serves /.well-known/acme-challenge/* directly)
acme_webroot = "/var/www/letsencrypt"

[security]
# Active edge perimeter defense (drops scanners & decoy path probes in < 15ns)
enable_defense = true

# Threat Intelligence & Incident Sinks (Completely Vendor-Agnostic / BYOK):
# 1. Optional Generic Webhook for your internal SIEM, Datadog, Splunk, Wazuh, Discord, or Slack
# webhook_url = "https://siem.internal.corp/api/v1/waf-alerts"

# 2. Optional AbuseIPDB Community Reporting (free tier safe with internal 24-hr sliding cooldown)
# abuseipdb_api_key = "YOUR_ABUSEIPDB_API_KEY"

# 3. Optional RFC 5424 Syslog / CEF (Common Event Format) for local air-gapped SIEM audit logs
# syslog_cef = true

# Obfuscated Server header returned downstream to confound fingerprinting
server_banner = "Propylea-Edge-Gateway/1.0"

# Enable HTTP Strict Transport Security (HSTS)
hsts = true

# Clickjacking mitigation header: DENY or SAMEORIGIN
frame_options = "DENY"

[maintenance]
# Seconds between autonomous memory vacuuming passes (releases unused heap to OS)
hygiene_interval_secs = 300

# Retained in-memory telemetry records in the ring buffer
max_telemetry_records = 10000

# Aggressively invoke malloc_trim to keep memory footprint < 15MB
memory_vacuum = true

# -----------------------------------------------------------------------------
# Upstream Host & SNI Routes
# -----------------------------------------------------------------------------

[[routes]]
domains = ["example.com", "www.example.com"]
upstream = "127.0.0.1:8080"
cert = "/etc/letsencrypt/live/example.com/fullchain.pem"
key = "/etc/letsencrypt/live/example.com/privkey.pem"
websocket = true

[[routes]]
domains = ["api.example.com"]
upstream = "127.0.0.1:8081"
cert = "/etc/letsencrypt/live/api.example.com/fullchain.pem"
key = "/etc/letsencrypt/live/api.example.com/privkey.pem"
websocket = false

# Speculative Hedged Tournament Racing (Requires --features hedged-racing)
# Eliminates tail latency spikes by speculatively racing multiple upstreams.
# Mutating requests (POST, PUT, DELETE) use single-flight with bounded circuit-breaker failover.
# [[routes]]
# domains = ["speed.example.com"]
# upstreams = ["127.0.0.1:8081", "127.0.0.1:8082", "127.0.0.1:8083"]
# hedged_racing = true
# cert = "/etc/letsencrypt/live/speed.example.com/fullchain.pem"
# key = "/etc/letsencrypt/live/speed.example.com/privkey.pem"
# websocket = true
